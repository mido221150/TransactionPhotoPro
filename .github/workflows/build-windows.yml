name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_mingw
          modules: qtimageformats qtpdf
          cache: true

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\TransactionPhotoPro | Out-Null
          Copy-Item build\TransactionPhotoPro.exe dist\TransactionPhotoPro\
          windeployqt --release --no-translations dist\TransactionPhotoPro\TransactionPhotoPro.exe
          Compress-Archive -Path dist\TransactionPhotoPro\* -DestinationPath dist\TransactionPhotoPro-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransactionPhotoPro-Windows-x64
          path: dist/TransactionPhotoPro-Windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/TransactionPhotoPro-Windows-x64.zip

